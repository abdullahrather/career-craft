# Local development: `docker compose up`, then open http://localhost:8000.
# Mailpit shows every email the app sends at http://localhost:8025.

x-php: &php
  build:
    context: docker/php
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  image: careercraft-php
  volumes:
    - .:/app
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  app:
    <<: *php
    command: php artisan serve --host=0.0.0.0 --port=8000
    ports:
      - '8000:8000'

  queue:
    <<: *php
    command: php artisan queue:work --tries=3

  vite:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - .:/app
    ports:
      - '5173:5173'

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: careercraft
      POSTGRES_USER: careercraft
      POSTGRES_PASSWORD: careercraft
    volumes:
      - postgres:/var/lib/postgresql
      - ./docker/postgres/create-test-database.sql:/docker-entrypoint-initdb.d/create-test-database.sql:ro
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U careercraft']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.29
    ports:
      - '8025:8025'

volumes:
  postgres:
