; `php artisan serve` runs PHP from the command line, where OPcache is off by default, so every
; request compiled every file again. A web server such as php-fpm has it on. Files are still
; checked for changes on every request, so edits show at once.
opcache.enable_cli = 1
opcache.memory_consumption = 256
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
